<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0f14" />
    <title>LANGKAH PULANG — Steps Home</title>
    <meta
      name="description"
      content="Game naratif 3D tentang pulang ke rumah, kejujuran, dan menemukan kembali jati diri di tengah kehidupan modern."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #preboot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: linear-gradient(180deg, #0b0e17 0%, #151824 55%, #23191d 100%);
        color: #fcf7ee;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      #preboot-bar-track {
        width: min(360px, 84vw);
        height: 8px;
        border-radius: 999px;
        background: rgba(252, 247, 238, 0.14);
        overflow: hidden;
        margin-top: 14px;
      }
      #preboot-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #d9823c, #f5c26b, #fde68a);
        transition: width 140ms ease-out;
      }
      #preboot-meta {
        width: min(360px, 84vw);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
        font-size: 12px;
        color: rgba(246, 224, 189, 0.85);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body class="bg-dusk-950 text-warm-50 antialiased selection:bg-warm-400/30 selection:text-warm-100 overflow-hidden">
    <div id="root">
      <!-- Splash pra-boot instan saat browser mengunduh berkas 3D & React (~2.3 MB) -->
      <div id="preboot-splash">
        <div style="font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(245, 194, 107, 0.85);">
          LANGKAH PULANG · STEPS HOME
        </div>
        <h1 style="margin: 8px 0 4px; font-family: Lora, Georgia, serif; font-size: clamp(22px, 4vw, 32px); font-weight: 500;">
          Menyiapkan Kota Senja 3D
        </h1>
        <div id="preboot-stage" style="font-size: 12px; color: rgba(252, 247, 238, 0.72);">
          Mengunduh berkas aplikasi &amp; mesin 3D...
        </div>
        <div id="preboot-bar-track">
          <div id="preboot-bar-fill"></div>
        </div>
        <div id="preboot-meta">
          <span id="preboot-size">0.00 MB / 2.38 MB</span>
          <strong id="preboot-pct" style="color: #f5c26b;">0%</strong>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var estTotalBytes = 2380 * 1024;
        var pct = 0;
        window.__lpBootPct = 0;
        function fmtSize(bytes) {
          if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
          return Math.max(0, Math.round(bytes / 1024)) + ' KB';
        }
        var timer = window.setInterval(function () {
          var fill = document.getElementById('preboot-bar-fill');
          var pctEl = document.getElementById('preboot-pct');
          var sizeEl = document.getElementById('preboot-size');
          if (!fill || !pctEl || !sizeEl) {
            window.clearInterval(timer);
            return;
          }
          var loadedBytes = 0;
          try {
            var entries = performance.getEntriesByType('resource') || [];
            for (var i = 0; i < entries.length; i++) {
              var e = entries[i];
              loadedBytes += e.decodedBodySize || e.encodedBodySize || e.transferSize || 0;
            }
          } catch (_) {}
          var realPct = loadedBytes > 0 ? Math.min(82, Math.round((loadedBytes / estTotalBytes) * 82)) : 0;
          pct = Math.min(85, Math.max(pct + 2, realPct));
          window.__lpBootPct = pct;
          var displayBytes = Math.max(loadedBytes, Math.round((pct / 100) * estTotalBytes));
          var totalBytes = Math.max(estTotalBytes, displayBytes);
          fill.style.width = pct + '%';
          pctEl.textContent = pct + '%';
          sizeEl.textContent = fmtSize(displayBytes) + ' / ' + fmtSize(totalBytes);
        }, 90);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
